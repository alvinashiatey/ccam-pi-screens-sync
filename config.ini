[sync]
# Hostnames are case-insensitive. Do not include .local here.
master_hostname = kiosk9

# Client IP addresses, separated by commas or new lines.
# kiosk9 (10.74.0.187) is the master and is intentionally omitted.
targets =
    10.74.0.179,
    10.74.0.180,
    10.74.0.181,
    10.74.0.182,
    10.74.0.183,
    10.74.0.184,
    10.74.0.185,
    10.74.0.186,
    10.74.0.188,
    10.74.0.189

port = 49999
interval = 0.05
start_delay = 5.0
soft_threshold = 0.010
hard_threshold = 0.080
slow_speed = 0.990
fast_speed = 1.010
packet_timeout = 2.0

[mpv]
socket = /tmp/mpv-sync.sock
# {home} is replaced with the service user's home directory.
default_video = {home}/mov/Yale_CCAM_Logo.mp4

[clock]
# When enabled, install.sh installs and configures Chrony automatically.
manage_chrony = yes

# Clients use kiosk9's fixed address as their preferred NTP source.
master_address = 10.74.0.187

# The master answers NTP requests only from this local network.
# Change this when reusing the project on a different network.
allow_network = 10.74.0.0/24
